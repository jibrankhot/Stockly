<div class="search-box">
    <div class="search-wrapper">
        <span class="search-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"
                stroke-linejoin="round">
                <circle cx="11" cy="11" r="7"></circle>

                <path d="m20 20-4-4"></path>
            </svg>
        </span>

        <input class="search-input" type="search" [value]="value" [placeholder]="placeholder" [disabled]="disabled"
            [attr.aria-label]="ariaLabel" (input)="onInput($any($event.target).value)" />

        @if (value && !disabled) {
        <button type="button" class="clear-button" aria-label="Clear search" (click)="clear()">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"
                stroke-linejoin="round" aria-hidden="true">
                <line x1="18" y1="6" x2="6" y2="18"></line>

                <line x1="6" y1="6" x2="18" y2="18"></line>
            </svg>
        </button>
        }
    </div>
</div>
