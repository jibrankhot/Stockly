<div class="select-field">
    @if (label) {
    <label class="select-label" [for]="selectId">
        {{ label }}

        @if (required) {
        <span class="required-indicator" aria-hidden="true">
            *
        </span>
        }
    </label>
    }

    <div class="select-wrapper" [class.select-wrapper-error]="!!errorMessage"
        [class.select-wrapper-disabled]="disabled">
        <select class="select-control" [id]="selectId" [name]="name || selectId" [value]="value ?? ''"
            [disabled]="disabled" [required]="required" [attr.aria-invalid]="
        errorMessage ? 'true' : null
      " [attr.aria-describedby]="
        errorMessage
          ? selectId + '-error'
          : hint
            ? selectId + '-hint'
            : null
      " (change)="onSelectionChange($any($event.target).value)" (blur)="onBlur()">
            <option value="" disabled [selected]="value === null">
                {{ placeholder }}
            </option>

            @for (
            option of options;
            track option.value
            ) {
            <option [value]="option.value" [disabled]="option.disabled">
                {{ option.label }}
            </option>
            }
        </select>

        <span class="select-arrow" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"
                stroke-linejoin="round">
                <polyline points="6 9 12 15 18 9"></polyline>
            </svg>
        </span>
    </div>

    @if (errorMessage) {
    <p class="select-error" [id]="selectId + '-error'" role="alert">
        {{ errorMessage }}
    </p>
    } @else if (hint) {
    <p class="select-hint" [id]="selectId + '-hint'">
        {{ hint }}
    </p>
    }
</div>
