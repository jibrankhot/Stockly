@if (open) {
<div class="modal-backdrop" role="presentation" (click)="onBackdropClick($event)">
    <section class="modal" [class.modal-small]="size === 'small'" [class.modal-medium]="size === 'medium'"
        [class.modal-large]="size === 'large'" [class.modal-fullscreen]="size === 'fullscreen'" role="dialog"
        aria-modal="true" [attr.aria-label]="title || 'Dialog'">
        <header class="modal-header">
            <div class="modal-title-wrapper">
                @if (title) {
                <h2 class="modal-title">
                    {{ title }}
                </h2>
                }
            </div>

            @if (showCloseButton) {
            <button type="button" class="modal-close-button" aria-label="Close dialog" (click)="close()">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"
                    stroke-linejoin="round" aria-hidden="true">
                    <line x1="18" y1="6" x2="6" y2="18"></line>
                    <line x1="6" y1="6" x2="18" y2="18"></line>
                </svg>
            </button>
            }
        </header>

        <div class="modal-body">
            <ng-content />
        </div>

        <footer class="modal-footer">
            <ng-content select="[modal-footer]" />
        </footer>
    </section>
</div>
}
