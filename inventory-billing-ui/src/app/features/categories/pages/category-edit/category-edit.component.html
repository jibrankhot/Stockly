<div class="category-edit-page">

    @if (isLoading) {

    <div class="loading-state" role="status" aria-live="polite">

        <div class="loading-indicator" aria-hidden="true">
            <span></span>
            <span></span>
            <span></span>
        </div>

        <h2>
            Loading category...
        </h2>

        <p>
            Please wait while the category is being loaded.
        </p>

    </div>

    } @else if (category) {

    <header class="page-header">

        <div class="page-header-content">

            <button type="button" class="back-button" (click)="onCancel()" [disabled]="isSubmitting">
                <span aria-hidden="true">
                    ←
                </span>

                <span>
                    Back to Category
                </span>
            </button>

            <h1>
                Edit Category
            </h1>

            <p>
                Update the information for
                <strong>{{ category.name }}</strong>.
            </p>

        </div>

    </header>

    <app-category-form [category]="category" [isSubmitting]="isSubmitting" (formSubmit)="onSubmit($event)"
        (cancel)="onCancel()" />

    } @else {

    <div class="not-found">

        <div class="not-found-icon" aria-hidden="true">
            ?
        </div>

        <h2>
            Category Not Found
        </h2>

        <p>
            The category you're trying to edit
            doesn't exist or could not be loaded.
        </p>

        <button type="button" class="btn btn-secondary" (click)="goBack()">
            Back to Categories
        </button>

    </div>

    }

</div>
