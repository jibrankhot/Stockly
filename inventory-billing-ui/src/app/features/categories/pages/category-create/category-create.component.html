<div class="category-create-page">
    <header class="page-header">
        <div class="page-header-content">
            <button type="button" class="back-button" (click)="onCancel()" [disabled]="isSubmitting"
                aria-label="Back to Categories">
                <span class="back-icon" aria-hidden="true">←</span>
                <span>Back to Categories</span>
            </button>

            <div class="page-heading">
                <span class="eyebrow">INVENTORY MANAGEMENT</span>
                <h1>Create Category</h1>
                <p>
                    Add a new category to organize your products.
                </p>
            </div>
        </div>
    </header>

    <section class="form-section" aria-label="Create category form">
        <div class="section-heading">
            <div class="section-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"
                    stroke-linejoin="round">
                    <path
                        d="M20.59 13.41 11 3.83A2 2 0 0 0 9.59 3H4a1 1 0 0 0-1 1v5.59A2 2 0 0 0 3.59 11l9.58 9.59a2 2 0 0 0 2.83 0l4.59-4.59a2 2 0 0 0 0-2.59Z" />
                    <circle cx="7.5" cy="7.5" r="1" />
                </svg>
            </div>

            <div class="section-heading-text">
                <h2>Category details</h2>
                <p>Enter the information for your new category.</p>
            </div>
        </div>

        <div class="form-content">
            <app-category-form [isSubmitting]="isSubmitting" (formSubmit)="onSubmit($event)" (cancel)="onCancel()" />
        </div>
    </section>
</div>
