<div class="product-edit-page">

    @if (isLoading) {
    <div class="loading-state">
        <p>Loading product...</p>
    </div>
    } @else if (product) {

    <div class="page-header">
        <div>
            <button type="button" class="back-button" (click)="onCancel()">
                ← Back to Product
            </button>

            <h1>Edit Product</h1>

            <p>
                Update the information for {{ product.name }}.
            </p>
        </div>
    </div>

    <app-product-form [product]="product" [isSubmitting]="isSubmitting" (formSubmit)="onSubmit($event)"
        (cancel)="onCancel()" />

    } @else {

    <div class="not-found">
        <div class="not-found-icon">?</div>

        <h2>Product Not Found</h2>

        <p>
            The product you're trying to edit doesn't exist.
        </p>

        <button type="button" class="btn btn-secondary" (click)="goBack()">
            Back to Products
        </button>
    </div>

    }

</div>
