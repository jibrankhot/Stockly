<div class="forgot-password">
    <div class="forgot-password-card">

        <div class="forgot-password-header">
            <div class="brand-mark" aria-hidden="true">
                S
            </div>

            <h1>Forgot Password?</h1>

            <p>
                Enter your email address and we'll send you a link
                to reset your password.
            </p>
        </div>

        @if (isSubmitted) {
        <div class="success-message" role="status" aria-live="polite">
            <div class="success-icon" aria-hidden="true">
                ✓
            </div>

            <div>
                <strong>Check your email</strong>

                <p>
                    If an account exists with this email address,
                    you'll receive password reset instructions shortly.
                </p>
            </div>
        </div>

        <a routerLink="/auth/login" class="back-to-login">
            ← Back to Login
        </a>
        } @else {
        <form class="forgot-password-form" [formGroup]="forgotPasswordForm" (ngSubmit)="onSubmit()" novalidate>
            <app-input label="Email Address" type="email" placeholder="Enter your email address" formControlName="email"
                [required]="true" autocomplete="email" />

            <app-button type="submit" variant="primary" size="large" [fullWidth]="true" [loading]="isSubmitting">
                Send Reset Link
            </app-button>
        </form>

        <a routerLink="/auth/login" class="back-to-login">
            ← Back to Login
        </a>
        }

    </div>
</div>
