<aside class="sidebar" [class.sidebar-closed]="!isOpen">
    <div class="sidebar-header">
        <a class="brand" routerLink="/dashboard" title="Stockly Dashboard" aria-label="Stockly Dashboard">
            <span class="brand-mark" aria-hidden="true">S</span>
            <span class="brand-name">Stockly</span>
        </a>
    </div>

    <nav class="sidebar-nav" aria-label="Main navigation">
        @for (item of sidebarItems; track item.label) {
        @if (hasChildren(item)) {
        <div class="nav-group" [class.nav-group-active]="isItemActive(item)">
            <button type="button" class="nav-item nav-parent" [class.expanded]="isMenuExpanded(item.label)"
                [class.parent-active]="isItemActive(item)" [attr.title]="!isOpen ? item.label : null"
                [attr.aria-label]="!isOpen ? item.label : item.label" [attr.aria-expanded]="isMenuExpanded(item.label)"
                (click)="toggleMenu(item.label)">
                <span class="nav-icon" aria-hidden="true">{{ item.icon }}</span>
                <span class="nav-label">{{ item.label }}</span>
                <span class="nav-arrow" aria-hidden="true">{{ isMenuExpanded(item.label) ? '−' : '+' }}</span>
            </button>

            @if (isMenuExpanded(item.label)) {
            <div class="submenu">
                @for (child of item.children; track child.route) {
                <a class="nav-item submenu-item" [routerLink]="child.route" routerLinkActive="active"
                    [routerLinkActiveOptions]="{ exact: false }" [title]="child.label">
                    <span class="nav-icon" aria-hidden="true">{{ child.icon }}</span>
                    <span class="nav-label">{{ child.label }}</span>
                </a>
                }
            </div>
            }
        </div>
        } @else {
        <a class="nav-item" [routerLink]="item.route" routerLinkActive="active"
            [routerLinkActiveOptions]="{ exact: false }" [title]="!isOpen ? item.label : null">
            <span class="nav-icon" aria-hidden="true">{{ item.icon }}</span>
            <span class="nav-label">{{ item.label }}</span>
        </a>
        }
        }
    </nav>
</aside>
