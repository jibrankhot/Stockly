<aside class="sidebar" [class.sidebar-closed]="!isOpen" [attr.aria-hidden]="!isOpen">

    <!-- =====================================================
       SIDEBAR HEADER
       ===================================================== -->

    <div class="sidebar-header">

        <a class="brand" routerLink="/dashboard" title="Stockly Dashboard">
            <span class="brand-mark">
                S
            </span>

            <span class="brand-name">
                Stockly
            </span>
        </a>

    </div>


    <!-- =====================================================
       SIDEBAR NAVIGATION
       ===================================================== -->

    <nav class="sidebar-nav" aria-label="Main navigation">

        @for (item of sidebarItems; track item.label) {

        <!-- =================================================
           MENU WITH CHILDREN
           ================================================= -->

        @if (hasChildren(item)) {

        <div class="nav-group">

            <button type="button" class="nav-item nav-parent" [class.expanded]="isMenuExpanded(item.label)"
                [attr.title]="!isOpen ? item.label : null" [attr.aria-expanded]="isMenuExpanded(item.label)"
                [attr.aria-label]="!isOpen ? item.label : null" (click)="toggleMenu(item.label)">

                <span class="nav-icon" aria-hidden="true">
                    {{ item.icon }}
                </span>

                <span class="nav-label">
                    {{ item.label }}
                </span>

                <span class="nav-arrow" aria-hidden="true">
                    {{ isMenuExpanded(item.label) ? '−' : '+' }}
                </span>

            </button>


            <!-- =================================================
               SUBMENU
               ================================================= -->

            @if (isMenuExpanded(item.label)) {

            <div class="submenu">

                @for (
                child of item.children;
                track child.label
                ) {

                <a class="nav-item submenu-item" [routerLink]="child.route" routerLinkActive="active"
                    [title]="!isOpen ? child.label : ''">

                    <span class="nav-icon" aria-hidden="true">
                        {{ child.icon }}
                    </span>

                    <span class="nav-label">
                        {{ child.label }}
                    </span>

                </a>

                }

            </div>

            }

        </div>

        }

        <!-- =================================================
           SINGLE MENU ITEM
           ================================================= -->

        @else {

        <a class="nav-item" [routerLink]="item.route" routerLinkActive="active"
            [routerLinkActiveOptions]="{ exact: true }" [title]="!isOpen ? item.label : ''">

            <span class="nav-icon" aria-hidden="true">
                {{ item.icon }}
            </span>

            <span class="nav-label">
                {{ item.label }}
            </span>

        </a>

        }

        }

    </nav>

</aside>
