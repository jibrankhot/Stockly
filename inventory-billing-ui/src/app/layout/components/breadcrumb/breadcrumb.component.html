<nav class="breadcrumb" aria-label="Breadcrumb">
    <a class="breadcrumb-item breadcrumb-home" routerLink="/dashboard" aria-label="Home" title="Home">
        <span class="home-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"
                stroke-linejoin="round">
                <path d="M3 10.5 12 3l9 7.5" />
                <path d="M5.5 9.5V21h13V9.5" />
                <path d="M9.5 21v-6h5v6" />
            </svg>
        </span>
        <span class="home-label">Home</span>
    </a>
    @for (breadcrumb of breadcrumbs; track breadcrumb.url) {
    <span class="breadcrumb-separator" aria-hidden="true">/</span>
    @if (breadcrumb.active) {
    <span class="breadcrumb-item current" aria-current="page" [title]="breadcrumb.label">{{ breadcrumb.label }}</span>
    } @else {
    <a class="breadcrumb-item" [routerLink]="breadcrumb.url" [title]="breadcrumb.label">{{ breadcrumb.label }}</a>
    }
    }
</nav>
