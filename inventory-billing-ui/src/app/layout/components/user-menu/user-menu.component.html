<div class="user-menu">

    <!-- =====================================================
       USER BUTTON
       ===================================================== -->

    <button type="button" class="user-button" aria-label="Open user menu" [attr.aria-expanded]="isMenuOpen"
        [attr.aria-haspopup]="true" (click)="toggleMenu()">

        <span class="avatar" aria-hidden="true">
            {{ initials }}
        </span>

        <span class="user-info">

            <span class="user-name">
                {{ displayName }}
            </span>

            <span class="user-role">
                {{ roleName }}
            </span>

        </span>

        <span class="dropdown-arrow" [class.open]="isMenuOpen" aria-hidden="true">
            ▾
        </span>

    </button>


    <!-- =====================================================
       USER DROPDOWN
       ===================================================== -->

    @if (isMenuOpen) {

    <div class="user-dropdown" role="menu">

        <!-- User Information -->

        <div class="dropdown-header">

            <span class="dropdown-avatar" aria-hidden="true">
                {{ initials }}
            </span>

            <div class="dropdown-user-info">

                <strong>
                    {{ displayName }}
                </strong>

                <span>
                    {{ currentUser?.email || 'No email available' }}
                </span>

            </div>

        </div>


        <div class="dropdown-divider"></div>


        <!-- Company Profile -->

        <button type="button" class="dropdown-item" role="menuitem" (click)="goToProfile()">

            <span class="item-icon" aria-hidden="true">
                ◉
            </span>

            <span>
                Company Profile
            </span>

        </button>


        <div class="dropdown-divider"></div>


        <!-- Logout -->

        <button type="button" class="dropdown-item logout-item" role="menuitem" (click)="logout()">

            <span class="item-icon" aria-hidden="true">
                ↪
            </span>

            <span>
                Logout
            </span>

        </button>

    </div>

    }

</div>
