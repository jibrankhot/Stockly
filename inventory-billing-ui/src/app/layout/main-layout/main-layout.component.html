<div class="main-layout" [class.sidebar-open]="isSidebarOpen" [class.sidebar-closed]="!isSidebarOpen"
    [class.is-navigating]="isNavigating">
    <aside class="navigation-column" aria-label="Application navigation">
        <app-sidebar [isOpen]="isSidebarOpen" />
    </aside>

    <section class="application-column">
        <app-navbar (menuToggle)="toggleSidebar()" />

        <main class="main-content">
            <div class="content-wrapper">
                <app-breadcrumb />

                <div class="page-content" [class.page-transition-active]="!isNavigating">
                    <router-outlet />
                </div>
            </div>
        </main>
    </section>

    @if (isSidebarOpen) {
    <button type="button" class="sidebar-overlay" aria-label="Close navigation menu"
        (click)="closeSidebarOnMobile()"></button>
    }

    @if (isNavigating) {
    <div class="navigation-loader" role="status" aria-live="polite" aria-label="Loading page">
        <div class="navigation-loader-card">
            <div class="navigation-spinner" aria-hidden="true"></div>
            <div class="navigation-loader-content">
                <strong>Loading</strong>
                <span>Preparing your page...</span>
            </div>
        </div>
    </div>
    }
</div>
